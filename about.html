      <h2>当院の紹介</h2>
      <p>和田クリニックは、地域の皆さまが気軽に相談できる町のかかりつけ医です。小さな症状でも遠慮なくご相談いただけます。院長は近所のおじいちゃんおばあちゃんも安心して来院できる、親しみやすい雰囲気です。</p>
      <p>当院では内科全般の診療を行っており、生活習慣病や体調のちょっとした変化も丁寧にサポートします。地域の皆さまの健康を長く守るお手伝いをすることが私たちの使命です。</p>
