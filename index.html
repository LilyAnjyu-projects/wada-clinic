  <!-- 診察時間 -->

    <h2>診察時間</h2>

    <!-- ここは後であなたの診察時間に書き換える -->
   <table class="time-table">
      <tr><th>曜日</th><th>午前</th><th>午後</th></tr>

      <tr><td>金</td><td>9:00〜12:30</td><td>15:00〜18:00</td></tr>
      <tr><td>土</td><td>9:00〜12:30</td><td>休診</td></tr>
      <tr><td>日・祝</td><td colspan="2">休診</td></tr>
    </table>
