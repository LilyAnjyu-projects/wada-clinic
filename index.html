<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>和田クリニック</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ヘッダーメニュー -->
  <header class="header">
     <img src="logo.png" alt="和田クリニックロゴ" class="logo">
  <h1>和田クリニック</h1>
    <nav>
      <ul>
        <li><a href="#first">初診の方へ</a></li>
        <li><a href="#about">当院の紹介</a></li>
        <li><a href="#doctor">医師紹介</a></li>
        <li><a href="#time">診察時間</a></li>
        <li><a href="#faq">よくある質問</a></li>
        <li><a href="#access">アクセス</a></li>
      </ul>
    </nav>
  </header>


  <!-- アイキャッチ部分 -->
  <section class="hero">
    <h1>ちょっとした心配も、気軽に相談できる場所。</h1>
    <p>あなたの“かかりつけ”でありたい。</p>
  </section>


  <!-- 診察時間 -->
  <section id="time" class="section">
    <h2>診察時間</h2>

    <!-- ここは後であなたの診察時間に書き換える -->
   <table class="time-table">
      <tr><th>曜日</th><th>午前</th><th>午後</th></tr>
      <tr><td>月</td><td>9:00〜12:00</td><td>15:00〜18:00</td></tr>
      <tr><td>火</td><td>9:00〜12:00</td><td>15:00〜18:00</td></tr>
       <tr><td>水</td><td>9:00〜12:00</td><td>15:00〜18:00</td></tr>
      <tr><td>木</td><td colspan="2">休診</td></tr>
      <tr><td>金</td><td>9:00〜12:00</td><td>15:00〜18:00</td></tr>
      <tr><td>土</td><td>9:00〜12:00</td><td>休診</td></tr>
      <tr><td>日・祝</td><td colspan="2">休診</td></tr>
    </table>
  </section>


  <!-- Googleカレンダー（あとであなたのIDに差し替え） -->
  <section id="calendar" class="section">
    <h2>お知らせ（予定）</h2>
    <iframe src="https://calendar.google.com/calendar/embed?src=あなたのGoogleカレンダーID&ctz=Asia/Tokyo"
            style="border: 0" width="100%" height="400" frameborder="0" scrolling="no">
    </iframe>
  </section>


  <!-- Googleマップ（あとで差し替え） -->
  <section id="access" class="section">
    <h2>アクセス</h2>
    <iframe
      src="あなたのGoogleマップ埋め込みコード"
      width="100%" height="350" style="border:0;" allowfullscreen loading="lazy">
    </iframe>
  </section>


</body>
</html>
