        <li>
          <strong>予約は必要ですか？</strong>
          <p>基本的には不要です。混雑時はお待ちいただくことがあります。</p>
        </li>
        <li>
          <strong>駐車場はありますか？</strong>
          <p>近くにコインパーキングがあります。公共交通機関のご利用もおすすめです。</p>
        </li>
        <li>
          <strong>保険証は必要ですか？</strong>
          <p>初診時および月初めには必ずご持参ください。</p>
        </li>
        <li>
          <strong>お薬手帳は必要ですか？</strong>
          <p>服薬中のお薬がある場合は持参してください。</p>
        </li>
